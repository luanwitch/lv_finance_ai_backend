services:
  - type: web
    name: lv-finance-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: "ollama"
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: LOG_LEVEL
        value: "INFO"
      - key: DJANGO_LOG_LEVEL
        value: "INFO"
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_VERIFICATION_TOKEN_LIFETIME_HOURS
        value: "24"
    env: python

  - type: pserv
    name: lv-finance-db
    plan: free
    databaseName: lv_finance
