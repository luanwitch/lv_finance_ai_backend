services:
  - type: web
    name: lv-finance-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: "ollama"
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
    env: python

  - type: pserv
    name: lv-finance-db
    plan: free
    databaseName: lv_finance
